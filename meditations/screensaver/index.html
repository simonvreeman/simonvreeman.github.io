<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>A moment of stillness · Meditations</title>
  <meta name="description" content="A quiet collection of marked passages from Marcus Aurelius’s Meditations. Take a moment, read slowly, and let a thought stay with you.">
  <link rel="canonical" href="https://vreeman.com/meditations/screensaver/">
  <script>
    // Holds the passage back until the script reveals one; without it, or if it
    // fails to load, the passage in the markup shows as it is.
    document.documentElement.classList.add('js');
    try {
      const theme = localStorage.getItem('meditations-appearance');
      if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
    } catch {}
  </script>
  <link rel="stylesheet" href="screensaver.css">
  <script type="module" src="screensaver.js" onerror="document.documentElement.classList.remove('js')"></script>
</head>
<body>
  <canvas id="head" aria-hidden="true"></canvas>
  <header class="chrome masthead">
    <a href="/meditations/" class="home" aria-label="Back to Meditations"><span aria-hidden="true">←</span> Meditations</a>
    <span>A moment of stillness</span>
  </header>
  <main aria-label="A passage from Meditations">
    <figure id="passage" class="fading">
      <blockquote id="quote">The things you think about determine the quality of your mind. Your soul takes on the color of your thoughts.</blockquote>
      <div class="ornament" aria-hidden="true"></div>
      <figcaption>
        <span class="author">Marcus Aurelius</span>
        <a id="reference" href="/meditations/#book5-16" target="_blank" rel="noopener">Meditations · 5.16</a>
      </figcaption>
    </figure>
  </main>
  <footer class="chrome controls-area">
    <div class="controls" aria-label="Screensaver controls" hidden>
      <button id="previous" class="icon-button" type="button" aria-label="Previous passage" title="Previous passage (←)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button>
      <button id="pause" class="icon-button" type="button" aria-label="Pause rotation" title="Pause rotation (Space)"><svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6v12M15 6v12"/></svg><svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 10 7-10 7Z"/></svg></button>
      <button id="next" class="icon-button" type="button" aria-label="Next passage" title="Next passage (→)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg></button>
      <span class="divider" aria-hidden="true"></span>
      <button id="appearance" class="icon-button" type="button" data-mode="system" aria-label="Appearance: system" title="Appearance: system"><svg class="system-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6.5"/><path class="solid" d="M12 5.5a6.5 6.5 0 0 1 0 13Z"/></svg><svg class="light-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 4.5v2m0 11v2M4.5 12h2m11 0h2M6.7 6.7l1.4 1.4m7.8 7.8 1.4 1.4m0-10.6-1.4 1.4m-7.8 7.8-1.4 1.4"/></svg><svg class="dark-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18.5 12.6A6.5 6.5 0 1 1 11.4 5.5a5 5 0 0 0 7.1 7.1Z"/></svg></button>
      <button id="screensaver" class="icon-button" type="button" aria-pressed="false" aria-label="Start screensaver" title="Start screensaver (F)" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/></svg></button>
    </div>
    <p id="status" class="status" role="status"></p>

  </footer>
</body>
</html>
