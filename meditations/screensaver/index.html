<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>A moment of stillness · Meditations</title>
  <meta name="description" content="A quiet collection of marked passages from Marcus Aurelius’s Meditations. Take a moment, read slowly, and let a thought stay with you.">
  <link rel="canonical" href="https://vreeman.com/meditations/screensaver/">
  <script>
    try {
      const theme = localStorage.getItem('meditations-appearance');
      if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
    } catch {}
  </script>
  <link rel="stylesheet" href="screensaver.css">
  <script type="module" src="screensaver.js"></script>
</head>
<body>
  <canvas id="head" aria-hidden="true"></canvas>
  <header class="chrome masthead">
    <a href="/meditations/" class="home" aria-label="Back to Meditations"><span aria-hidden="true">←</span> Meditations</a>
    <span class="eyebrow">A moment of stillness</span>
  </header>
  <main aria-label="A passage from Meditations">
    <figure id="passage">
      <blockquote id="quote">The things you think about determine the quality of your mind. Your soul takes on the color of your thoughts.</blockquote>
      <div class="ornament" aria-hidden="true"></div>
      <figcaption>
        <span class="author">Marcus Aurelius</span>
        <a id="reference" href="/meditations/#book5-16" target="_blank" rel="noopener">Meditations · 5.16</a>
      </figcaption>
    </figure>
  </main>
  <footer class="chrome controls-area">
    <div class="controls" aria-label="Screensaver controls" hidden>
      <button id="previous" class="icon-button" type="button" aria-label="Previous passage" title="Previous passage (←)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button>
      <button id="pause" class="icon-button" type="button" aria-label="Pause rotation" title="Pause rotation (Space)"><svg viewBox="0 0 24 24" aria-hidden="true"><path id="pause-icon" d="M9 6v12M15 6v12"/></svg></button>
      <button id="next" class="icon-button" type="button" aria-label="Next passage" title="Next passage (→)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg></button>
      <span class="divider" aria-hidden="true"></span>
      <label class="appearance"><span class="sr-only">Appearance</span><select id="appearance" title="Appearance"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
      <button id="awake" type="button" aria-pressed="false" hidden>Keep awake</button>
      <button id="fullscreen" class="icon-button" type="button" aria-label="Enter fullscreen" title="Enter fullscreen (F)" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/></svg></button>
    </div>
    <p id="status" class="status" role="status"></p>
  </footer>
</body>
</html>
